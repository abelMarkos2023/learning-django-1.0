{% extends 'webapp/base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-8">
            <div class="card shadow-lg border-0 mt-5">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Welcome Back</h3>
                        <p class="text-muted">Sign in to manage your clients</p>
                    </div>

                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mt-4 auth-btn">
                            Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-bold auth-link">Create Account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
