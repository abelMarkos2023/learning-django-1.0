{% extends 'webapp/base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-8">
            <div class="card shadow-lg border-0 mt-5">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">Create Account</h3>
                        <p class="text-muted">Start managing your clients today</p>
                    </div>

                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mt-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold" style="color: #667eea;">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
